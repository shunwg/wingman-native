name: Rebuild web preview

# Keeps docs/ (what GitHub Pages serves) in sync with source automatically.
# Triggers on anything except a change to docs/ itself, so the commit this
# workflow makes back to the branch does not re-trigger itself.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:pages

      - name: Commit the rebuilt preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rebuild web preview [skip ci]"
          git push
